<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SargantAnna — Traductor Valencià · Español</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="theme-color" content="#2b4512">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2914;--soft:#58613f;--paper:#f7f9ee;--panel:#fff;--line:#d8dfc0;--blue:#3f6b1a;--blue-d:#2b4512;--blue-t:#eaf1d9;--az-t:#f3f7cf;--lime:#a6c51a;--r:18px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Work Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);display:flex;justify-content:center}
.app{width:100%;max-width:640px;height:100dvh;display:flex;flex-direction:column;background:var(--panel);border:0 solid var(--line);border-width:0 1px}
header{padding:18px 20px 16px;border-bottom:3px solid var(--lime);text-align:center;flex-shrink:0}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:28px;margin:0;color:var(--blue-d)}
.logo{display:block;width:min(100%,340px);height:auto;margin:0 auto;mix-blend-mode:multiply}
.tagline{margin:6px 0 0;font-size:13.5px;color:var(--soft)}
select{margin-top:12px;width:100%;font:500 13.5px 'Work Sans',sans-serif;color:var(--blue-d);background:var(--blue-t);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.chat{background:url('/hojas.svg') 0 0/320px 320px,#fcfdf7;flex:1;overflow-y:auto;padding:20px 18px 8px;display:flex;flex-direction:column;gap:14px}
.row{display:flex}.row.user{justify-content:flex-end}
.bubble{max-width:84%;padding:11px 14px;font-size:14.5px;line-height:1.5;border-radius:var(--r);white-space:pre-wrap;word-wrap:break-word}
.bot .bubble{background:var(--blue-t);border:1px solid #d3e0b8;border-bottom-left-radius:4px;color:#243516}
.user .bubble{background:var(--az-t);border:1px solid #d3e57e;border-bottom-right-radius:4px;color:#3a4a0c}
.bubble img{max-width:160px;max-height:160px;border-radius:10px;display:block}
.bubble a{color:var(--blue-d);font-weight:600}
.dots span{display:inline-block;width:5px;height:5px;margin-right:3px;border-radius:50%;background:var(--blue);opacity:.35;animation:b 1.1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:.9}}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
.modes{display:flex;gap:8px;padding:10px 18px;overflow-x:auto;flex-shrink:0;border-top:1px solid var(--line);background:#fdfcf9}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--soft);font:500 13px 'Work Sans',sans-serif;padding:8px 13px;border-radius:999px;white-space:nowrap;cursor:pointer}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
.dock{flex-shrink:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.input-row{display:flex;align-items:flex-end;gap:8px}
textarea{flex:1;resize:none;max-height:120px;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;font:14.5px/1.4 'Work Sans',sans-serif;color:var(--ink);background:var(--paper)}
textarea:focus{outline:none;border-color:var(--blue)}
.send{border:none;border-radius:50%;width:42px;height:42px;flex-shrink:0;background:var(--blue);color:#fff;font-size:16px;cursor:pointer}
.send:disabled{background:#b9c3a0;cursor:not-allowed}
.dz{border:2px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;cursor:pointer;background:var(--paper)}
.dz.over{border-color:var(--blue);background:var(--blue-t)}
.dz b{display:block;font-size:14px;color:var(--blue-d)}
.dz small{font-size:12.5px;color:var(--soft)}
</style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo" src="/fondo.png" alt="SargantAnna">
    <p class="tagline">Chatbot con IA para traducir entre valencià y español: texto, documentos e imágenes.</p>
    <select id="dir" aria-label="Dirección de la traducción">
      <option value="auto">Detectar idioma automáticamente</option>
      <option value="val-spa">Valencià → Español</option>
      <option value="spa-val">Español → Valencià</option>
    </select>
  </header>

  <div class="chat" id="chat">
    <div class="row bot"><div class="bubble">Hola, soy SargantAnna. Escríbeme en valenciano o español y te lo traduzco, o pregúntame dudas de la lengua. También puedes subir documentos (Word, PowerPoint, PDF) o imágenes con texto.</div></div>
  </div>

  <div class="modes" id="modes">
    <button class="chip active" data-mode="text">Chat / texto</button>
    <button class="chip" data-mode="document">Documentos</button>
    <button class="chip" data-mode="image">Imágenes</button>
  </div>

  <div class="dock">
    <div class="input-row" id="textDock">
      <textarea id="input" rows="1" placeholder="Escribe un texto o una pregunta…"></textarea>
      <button class="send" id="send" aria-label="Enviar">➤</button>
    </div>
    <div id="fileDock" style="display:none">
      <div class="dz" id="dz"><b id="dzTitle"></b><small id="dzSub"></small>
        <input type="file" id="file" hidden>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  // Si abres la página con otro servidor local (p. ej. python -m http.server 8000),
  // el backend está en el puerto 5000. En cualquier otro caso (Vercel, o http://localhost:5000)
  // la página y el backend comparten dirección, así que se usan rutas relativas.
  const h = location.hostname;
  const isLocalStatic = (!h || h === 'localhost' || h === '127.0.0.1' || h.startsWith('192.168.')) && location.port !== '5000';
  const BACKEND_URL = isLocalStatic ? `http://${h || 'localhost'}:5000` : '';

  const $ = (id) => document.getElementById(id);
  const chat = $('chat'), input = $('input'), sendBtn = $('send'), dir = $('dir'), file = $('file'), dz = $('dz');
  let mode = 'text';
  let history = [];   // memoria de la conversación para el chat

  const MODES = {
    document: { title: 'Arrastra un documento o toca para elegir', sub: 'Word (.docx), PowerPoint (.pptx) o PDF', accept: '.docx,.pptx,.pdf' },
    image: { title: 'Arrastra una imagen o toca para elegir', sub: 'JPG, PNG, WEBP — se lee el texto y se traduce', accept: 'image/png,image/jpeg,image/webp,image/gif' }
  };

  const esc = (s) => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

  function bubble(html, who) {
    const row = document.createElement('div');
    row.className = 'row ' + who;
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = html;
    row.appendChild(b);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return b;
  }
  const typing = () => bubble('<span class="dots"><span></span><span></span><span></span></span>', 'bot');
  const fail = (b, msg) => { b.innerHTML = `<em>${esc(msg)}</em>`; chat.scrollTop = chat.scrollHeight; };
  const NO_CONN = 'No se pudo conectar con el backend. ¿Está arrancado (python app.py)?';

  // ---------- Modos ----------
  $('modes').addEventListener('click', (e) => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    $('textDock').style.display = mode === 'text' ? 'flex' : 'none';
    $('fileDock').style.display = mode === 'text' ? 'none' : 'block';
    if (mode !== 'text') {
      $('dzTitle').textContent = MODES[mode].title;
      $('dzSub').textContent = MODES[mode].sub;
      file.accept = MODES[mode].accept;
    }
  });

  // ---------- Chat ----------
  function grow() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; }
  input.addEventListener('input', grow);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
  sendBtn.addEventListener('click', sendText);

  async function sendText() {
    const text = input.value.trim();
    if (!text || sendBtn.disabled) return;
    bubble(esc(text), 'user');
    input.value = ''; grow();
    sendBtn.disabled = true;
    const b = typing();
    try {
      const r = await fetch(`${BACKEND_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensaje: text, historial: history, direccion: dir.value })
      });
      const data = await r.json();
      if (data.error) return fail(b, 'No se pudo responder: ' + data.error);
      b.textContent = data.respuesta;
      history.push({ role: 'user', content: text }, { role: 'assistant', content: data.respuesta });
      history = history.slice(-20);
      chat.scrollTop = chat.scrollHeight;
    } catch { fail(b, NO_CONN); }
    finally { sendBtn.disabled = false; }
  }

  // ---------- Archivos e imágenes ----------
  dz.addEventListener('click', () => file.click());
  dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('over'));
  dz.addEventListener('drop', (e) => {
    e.preventDefault(); dz.classList.remove('over');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  file.addEventListener('change', () => { if (file.files.length) handleFile(file.files[0]); file.value = ''; });

  const MAX_MB = 4; // límite de subida del hosting gratuito (~4,5 MB)

  function handleFile(f) {
    if (f.size > MAX_MB * 1024 * 1024) {
      return bubble(`<em>El archivo pesa más de ${MAX_MB} MB. Prueba con uno más pequeño o divídelo.</em>`, 'bot');
    }
    if (mode === 'image') {
      if (!f.type.startsWith('image/')) return bubble('<em>Eso no parece una imagen.</em>', 'bot');
      const reader = new FileReader();
      reader.onload = (e) => { bubble(`<img src="${e.target.result}" alt="${esc(f.name)}">`, 'user'); translateImage(f); };
      reader.readAsDataURL(f);
    } else {
      const ext = f.name.split('.').pop().toLowerCase();
      if (!['docx', 'pptx', 'pdf'].includes(ext)) {
        return bubble('<em>Formato no soportado. Usa .docx, .pptx o .pdf (si es .doc, guárdalo como .docx).</em>', 'bot');
      }
      bubble(`📎 ${esc(f.name)} · ${Math.max(1, Math.round(f.size / 1024))} KB`, 'user');
      translateDoc(f, ext);
    }
  }

  const formData = (f) => { const fd = new FormData(); fd.append('file', f); fd.append('direccion', dir.value); return fd; };

  async function translateImage(f) {
    const b = typing();
    try {
      const r = await fetch(`${BACKEND_URL}/traducir-imagen`, { method: 'POST', body: formData(f) });
      const data = await r.json();
      if (data.error) return fail(b, 'No se pudo procesar la imagen: ' + data.error);
      if (!data.texto_original && !data.traduccion) return fail(b, data.aviso || 'No se detectó texto en la imagen.');
      b.innerHTML = `<strong>Texto detectado:</strong>\n${esc(data.texto_original || '')}\n\n<strong>Traducción:</strong>\n${esc(data.traduccion || '')}`;
      chat.scrollTop = chat.scrollHeight;
    } catch { fail(b, NO_CONN); }
  }

  async function translateDoc(f, ext) {
    const b = typing();
    try {
      const r = await fetch(`${BACKEND_URL}/traducir-archivo`, { method: 'POST', body: formData(f) });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        return fail(b, 'No se pudo traducir el documento: ' + (data.error || 'error desconocido'));
      }
      const name = f.name.replace(/\.[^.]+$/, '') + '_traducido.' + ext;
      const url = URL.createObjectURL(await r.blob());
      b.innerHTML = `Documento traducido: <a href="${url}" download="${esc(name)}">${esc(name)}</a>`;
      chat.scrollTop = chat.scrollHeight;
    } catch { fail(b, NO_CONN); }
  }
})();
</script>
</body>
</html>
